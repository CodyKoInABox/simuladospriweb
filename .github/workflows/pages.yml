name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar simulados
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter os arquivos
        uses: actions/checkout@v6

      - name: Verificar conteúdo e aplicação
        run: |
          node --check assets/app.js
          node --check assets/engine.js
          node --check assets/questions.js
          npm test

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar os arquivos públicos
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets _site/
          touch _site/.nojekyll

      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
